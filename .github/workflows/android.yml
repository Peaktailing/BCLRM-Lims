name: android

# Builds the Android companion app and checks it in an emulator against a
# real BioManager server. Runs on changes to android/, by hand, and from the
# release workflow, which publishes the APK.
#
# Optional secrets, for a release key (without them the APK is debug-signed):
#   ANDROID_KEYSTORE_B64       base64 of the .jks keystore
#   ANDROID_KEYSTORE_PASSWORD  its store and key password

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml", "app/static/offline/**", "app/translations/zh/js-offline.json"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v0.1.0 (blank for a dev build)"
        type: string
        required: false
  workflow_call:
    inputs:
      version:
        description: "Version tag, e.g. v0.1.0"
        type: string
        required: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Version
        run: |
          TAG="${{ inputs.version }}"
          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
            echo "VERSION_CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.0-dev.${{ github.run_number }}" >> "$GITHUB_ENV"
            echo "VERSION_CODE=1" >> "$GITHUB_ENV"
          fi

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: the APK is signed with a debug key."
          fi

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          gradle -p android assembleRelease --no-daemon -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
          cp android/app/build/outputs/apk/release/app-release.apk BioManager-Android.apk
      - name: Signing certificate
        # Every release must carry the same certificate, or phones refuse the update.
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs BioManager-Android.apk | grep -E "SHA-256|DN"

      # ---- smoke test: the app against a real server, in an emulator
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Start a demo BioManager server
        run: |
          grep -v pywebview requirements.txt > "$RUNNER_TEMP/req.txt"
          python -m pip install -q -r "$RUNNER_TEMP/req.txt"
          python scripts/demo-data.py "$RUNNER_TEMP/demo"
          echo "SERVER_LOG=$RUNNER_TEMP/server.log" >> "$GITHUB_ENV"
          echo "DEMO_DIR=$RUNNER_TEMP/demo" >> "$GITHUB_ENV"
          BIOMANAGER_DATA_DIR="$RUNNER_TEMP/demo" PORT=5077 nohup python run.py > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 30); do curl -fsS http://127.0.0.1:5077/healthz && break; sleep 1; done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # No Google Play services: on a loaded CI machine they hang, and Android
          # then kills every app bound to them. Only the Scan button needs them.
          target: default
          arch: x86_64
          disable-animations: true
          script: ./android/ci-smoke.sh BioManager-Android.apk smoke

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-smoke-screenshots
          path: smoke/
      - uses: actions/upload-artifact@v7
        with:
          name: BioManager-Android.apk
          path: BioManager-Android.apk
          if-no-files-found: error
