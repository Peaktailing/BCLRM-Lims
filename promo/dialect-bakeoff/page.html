<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方言 TTS 盲听</title>
<style>
:root {
  --bg: #f6f5f1; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a65; --line: #e3e1da;
  --accent: #2f5bd3; --accent-ink: #ffffff; --soft: #eef2fc; --good: #2e7d4f;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151514; --card: #1f1f1d; --ink: #ecebe6; --muted: #9b9a94; --line: #34332f;
    --accent: #7c9cf5; --accent-ink: #10131c; --soft: #232a3d; --good: #6cc792;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151514; --card: #1f1f1d; --ink: #ecebe6; --muted: #9b9a94; --line: #34332f;
  --accent: #7c9cf5; --accent-ink: #10131c; --soft: #232a3d; --good: #6cc792;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
}
main { max-width: 860px; margin: 0 auto; padding: 28px 16px 120px; }
h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: -0.01em; }
.lede { color: var(--muted); margin: 0 0 20px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
input[type=text] {
  font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 10px; min-width: 0; flex: 1 1 180px; max-width: 260px;
}
button, .btn {
  font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 12px; cursor: pointer;
}
button:hover, .btn:hover { border-color: var(--accent); }
button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 22px 0 14px; }
.tabs .count { opacity: .7; font-size: 12px; margin-left: 4px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.card h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 4px; text-transform: uppercase; letter-spacing: .04em; }
.say { font-size: 17px; margin: 0 0 12px; }
.clip { display: grid; grid-template-columns: 34px 1fr; gap: 6px 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.letter { font-weight: 700; font-size: 18px; color: var(--accent); align-self: center; text-align: center; }
audio { width: 100%; height: 36px; }
.scores { grid-column: 2; display: flex; gap: 16px; flex-wrap: wrap; }
.scale { display: flex; align-items: center; gap: 4px; }
.scale span { color: var(--muted); font-size: 13px; margin-right: 2px; }
.scale button { width: 32px; padding: 4px 0; text-align: center; }
.who { grid-column: 2; font-size: 13px; color: var(--good); }
.empty { color: var(--muted); font-style: italic; }
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
  padding: 10px 16px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
}
.bar .note { color: var(--muted); font-size: 13px; align-self: center; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
th { font-weight: 600; color: var(--muted); font-size: 12px; }
td.best { color: var(--good); font-weight: 700; }
.scroll { overflow-x: auto; }
.hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
</style>
</head>
<body>
<main>
  <h1>方言 TTS 盲听</h1>
  <p class="lede">每句话由几个模型各读一遍，顺序已打乱，只标 A、B、C……。请会说这种方言的人逐条听，给两项打分（1 很差，5 像本地人）：<b>地道</b>是像不像这种方言，<b>自然</b>是像不像真人说话。打完点下面的“导出评分”，把文件发回来。</p>
  <div class="row">
    <label for="rater">你的名字</label>
    <input id="rater" type="text" placeholder="例如：阿珍（上海）">
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
  <div id="summary"></div>
</main>
<div class="bar">
  <span class="note" id="progress"></span>
  <button id="reveal">揭晓</button>
  <button id="export">导出评分</button>
  <label class="btn">导入评分<input id="import" type="file" accept=".json" multiple hidden></label>
  <button id="clear">清空我的评分</button>
</div>
<script>
const DATA = /*DATA*/null;
const KEY = "dialect-bakeoff";
const store = {
  get() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } },
  set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {} },
};
const saved = store.get();
const state = {
  rater: saved.rater || "",
  seed: saved.seed || Math.random().toString(36).slice(2),
  ratings: saved.ratings || {},          // clip id → {auth, nat}
  others: [],                             // imported files: {rater, ratings}
  dialect: saved.dialect || (DATA.dialects[0] && DATA.dialects[0].name),
  revealed: false,
};
const save = () => store.set({ rater: state.rater, seed: state.seed, ratings: state.ratings, dialect: state.dialect });

// A shuffle that stays the same for one listener, so the letters don't move between visits.
function hash(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.codePointAt(0), 16777619); return h >>> 0; }
function shuffled(list, key) {
  let a = hash(state.seed + key);
  const rand = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const out = list.slice();
  for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
  return out;
}
const clipsOf = (dialect, line) => DATA.clips.filter(c => c.dialect === dialect && c.line === line);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };

function scale(clip, field, label) {
  const box = el("div", { className: "scale" }, el("span", { textContent: label }));
  for (let n = 1; n <= 5; n++) {
    const b = el("button", { textContent: n, title: `${label} ${n}` });
    if ((state.ratings[clip.id] || {})[field] === n) b.classList.add("on");
    b.onclick = () => {
      const r = state.ratings[clip.id] = state.ratings[clip.id] || {};
      r[field] = r[field] === n ? undefined : n;
      save(); render();
    };
    box.append(b);
  }
  return box;
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.replaceChildren(...DATA.dialects.map(d => {
    const ids = DATA.clips.filter(c => c.dialect === d.name).map(c => c.id);
    const done = ids.filter(id => (state.ratings[id] || {}).auth && state.ratings[id].nat).length;
    const b = el("button", { className: d.name === state.dialect ? "on" : "" }, d.name,
                 el("span", { className: "count", textContent: `${done}/${ids.length}` }));
    b.onclick = () => { state.dialect = d.name; save(); render(); };
    return b;
  }));
}

function renderView() {
  const d = DATA.dialects.find(x => x.name === state.dialect);
  const view = document.getElementById("view");
  if (!d) { view.replaceChildren(el("p", { className: "empty", textContent: "还没有生成任何音频。" })); return; }
  const cards = [["shared", "普通话写的句子，让模型自己说成" + d.name, DATA.shared],
                 ["local", "用" + d.name + "的词写的句子", d.local]].map(([line, title, text]) => {
    const clips = shuffled(clipsOf(d.name, line), d.name + line);
    const card = el("section", { className: "card" }, el("h2", { textContent: title }), el("p", { className: "say", textContent: text }));
    if (!clips.length) card.append(el("p", { className: "empty", textContent: "这一句没有音频。" }));
    clips.forEach((c, i) => {
      const row = el("div", { className: "clip" },
        el("div", { className: "letter", textContent: String.fromCharCode(65 + i) }),
        el("audio", { controls: true, preload: "none", src: c.file }),
        el("div", { className: "scores" }, scale(c, "auth", "地道"), scale(c, "nat", "自然")));
      if (state.revealed) row.append(el("div", { className: "who",
        textContent: `${DATA.systems[c.system] || c.system} · ${c.seconds} 秒 · 生成用了 ${c.seconds_to_make} 秒` }));
      card.append(row);
    });
    return card;
  });
  view.replaceChildren(...cards);
}

function allRatings() {
  const mine = { rater: state.rater || "我", ratings: state.ratings };
  return [mine, ...state.others];
}

function renderSummary() {
  const box = document.getElementById("summary");
  if (!state.revealed) { box.replaceChildren(); return; }
  const byId = Object.fromEntries(DATA.clips.map(c => [c.id, c]));
  const sums = {};   // system → dialect → {auth:[..], nat:[..]}
  const raters = allRatings();
  for (const r of raters) for (const [id, s] of Object.entries(r.ratings || {})) {
    const c = byId[id]; if (!c) continue;
    const cell = ((sums[c.system] = sums[c.system] || {})[c.dialect] = sums[c.system][c.dialect] || { auth: [], nat: [] });
    if (s.auth) cell.auth.push(s.auth);
    if (s.nat) cell.nat.push(s.nat);
  }
  const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const fmt = v => v == null ? "–" : v.toFixed(1);
  const systems = Object.keys(DATA.systems).filter(s => DATA.clips.some(c => c.system === s));
  const dialects = DATA.dialects.map(d => d.name);
  const head = el("tr", {}, el("th", { textContent: "模型（地道 / 自然）" }),
                  ...dialects.map(d => el("th", { textContent: d })), el("th", { textContent: "平均" }));
  const cellVal = (s, d) => { const c = (sums[s] || {})[d]; return c ? [mean(c.auth), mean(c.nat)] : [null, null]; };
  const best = Object.fromEntries(dialects.map(d => [d, Math.max(...systems.map(s => cellVal(s, d)[0] ?? -1))]));
  const rows = systems.map(s => {
    const all = Object.values(sums[s] || {});
    const avg = [mean(all.flatMap(c => c.auth)), mean(all.flatMap(c => c.nat))];
    return el("tr", {}, el("td", { textContent: DATA.systems[s] }),
      ...dialects.map(d => { const [a, n] = cellVal(s, d);
        return el("td", { className: a != null && a === best[d] ? "best" : "", textContent: a == null ? "–" : `${fmt(a)} / ${fmt(n)}` }); }),
      el("td", { textContent: `${fmt(avg[0])} / ${fmt(avg[1])}` }));
  });
  box.replaceChildren(el("section", { className: "card" },
    el("h2", { textContent: `结果 · ${raters.length} 位听者：` + raters.map(r => r.rater).join("、") }),
    el("div", { className: "scroll" }, el("table", {}, el("thead", {}, head), el("tbody", {}, ...rows))),
    el("p", { className: "hint", textContent: "每格是“地道 / 自然”的平均分，两句话合在一起算；绿色是这种方言里最地道的。只该看会说这种方言的人给的分。" })));
}

function renderProgress() {
  const n = DATA.clips.filter(c => (state.ratings[c.id] || {}).auth && state.ratings[c.id].nat).length;
  document.getElementById("progress").textContent = `已打分 ${n} / ${DATA.clips.length}`;
  document.getElementById("reveal").textContent = state.revealed ? "隐藏" : "揭晓";
}

function render() { renderTabs(); renderView(); renderSummary(); renderProgress(); }

const rater = document.getElementById("rater");
rater.value = state.rater;
rater.oninput = () => { state.rater = rater.value.trim(); save(); };
document.getElementById("reveal").onclick = () => {
  if (!state.revealed && !confirm("揭晓后就能看到每条是哪个模型做的，之后的打分就不再是盲听了。确定吗？")) return;
  state.revealed = !state.revealed; render();
};
document.getElementById("export").onclick = () => {
  const blob = new Blob([JSON.stringify({ rater: state.rater || "匿名", ratings: state.ratings, at: new Date().toISOString() }, null, 1)],
                        { type: "application/json" });
  const a = el("a", { href: URL.createObjectURL(blob), download: `方言盲听-${state.rater || "匿名"}.json` });
  document.body.append(a); a.click(); a.remove();
};
document.getElementById("import").onchange = async e => {
  for (const f of e.target.files) {
    try {
      const r = JSON.parse(await f.text());
      if (r && r.ratings) state.others.push({ rater: r.rater || f.name, ratings: r.ratings });
    } catch { alert(`${f.name} 不是导出的评分文件。`); }
  }
  e.target.value = ""; render();
};
document.getElementById("clear").onclick = () => {
  if (confirm("清空你在这个页面上打的所有分？")) { state.ratings = {}; save(); render(); }
};
render();
</script>
</body>
</html>
